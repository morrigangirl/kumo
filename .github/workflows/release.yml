name: Prepare Kumo GitHub Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified draft as the latest browser update
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kumo-github-release
  cancel-in-progress: false

jobs:
  release:
    # Never run privileged signing jobs for pull requests, forks or branch
    # dispatches. Configure this environment to allow only the protected main
    # branch and require a release maintainer's approval.
    if: github.repository == 'morrigangirl/kumo' && github.ref == 'refs/heads/main'
    environment: github-release
    runs-on: [self-hosted, macOS, ARM64, kumo-release]
    timeout-minutes: 1440
    permissions:
      contents: write
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      KUMO_NOTARY_PROFILE: ${{ vars.KUMO_NOTARY_PROFILE }}
      KUMO_NOTARY_KEYCHAIN: ${{ vars.KUMO_NOTARY_KEYCHAIN }}
      KUMO_DEVELOPER_ID_SHA1: ${{ vars.KUMO_DEVELOPER_ID_SHA1 }}
      KUMO_INSTALLER_IDENTITY: ${{ vars.KUMO_INSTALLER_IDENTITY }}
      KUMO_CLAMAV_DATABASE: ${{ vars.KUMO_CLAMAV_DATABASE }}
      KUMO_PASSKEY_PROFILE: ${{ vars.KUMO_PASSKEY_PROFILE }}
    steps:
      - name: Check out the exact reviewed commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Preserve the dedicated runner's ignored multi-hundred-GB source
          # cache. The next step refuses all tracked/untracked source changes.
          clean: false

      - name: Validate release runner and committed configuration
        run: |
          test -n "$KUMO_NOTARY_PROFILE"
          if [[ -n "$KUMO_NOTARY_KEYCHAIN" ]]; then
            test -f "$KUMO_NOTARY_KEYCHAIN"
          fi
          test -n "$KUMO_DEVELOPER_ID_SHA1"
          test -n "$KUMO_INSTALLER_IDENTITY"
          test -d "$KUMO_CLAMAV_DATABASE"
          test -f build/installer-inputs/clamav-1.5.4.tar.gz
          test -d build/installer-inputs/notices
          test -f build/clamav-downloads/clamav-1.5.4.macos.universal.pkg
          test -x /usr/local/clamav/bin/sigtool
          test -d /usr/local/clamav/etc/certs
          test "$(uname -m)" = arm64
          command -v gh >/dev/null
          command -v node >/dev/null
          xcrun --find swift >/dev/null
          python3 - <<'PY'
          import os, runpy, subprocess
          from pathlib import Path
          api = runpy.run_path("scripts/github-release.py")
          api["git_commit"]()
          config = api["load_config"]()
          tag = api["release_tag"](config)
          notes = "docs/releases/" + config["version"] + ".md"
          if not Path(notes).is_file():
              raise SystemExit("Committed release notes are missing")
          commit = subprocess.check_output(["git", "rev-parse", "refs/tags/" + tag + "^{commit}"], text=True).strip()
          if commit != os.environ["GITHUB_SHA"]:
              raise SystemExit("The pushed release tag must point to this exact workflow commit")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("KUMO_RELEASE_TAG=" + tag + "\n")
              output.write("KUMO_RELEASE_ARCHIVE=" + api["archive_name"](config) + "\n")
              output.write("KUMO_RELEASE_BASE_DIRECTORY=dist/github-release-base/" + tag + "\n")
              output.write("KUMO_RELEASE_DIRECTORY=dist/github-releases/" + tag + "\n")
              output.write("KUMO_RELEASE_INSTALLER_DIRECTORY=dist/installer/" + tag + "\n")
              output.write("KUMO_RELEASE_NOTES=" + notes + "\n")
              output.write("KUMO_RELEASE_SOURCE_DIR=build/release-source-" + os.environ["GITHUB_SHA"] + "\n")
          PY

      - name: Prepare pinned update tools and protection data
        run: |
          python3 scripts/prepare-release-vendor.py
          python3 scripts/source.py doctor
          python3 scripts/prepare-sparkle.py
          if [[ -e build/agent-runtime || -L build/agent-runtime ]]; then
            python3 scripts/prepare-agent-runtime.py --verify
          else
            python3 scripts/prepare-agent-runtime.py
          fi
          python3 scripts/prepare-malware-feed.py
          /usr/bin/python3 scripts/prepare-phishlang.py

      - name: Run release regressions
        run: |
          npm test
          python3 -m unittest scripts.test_native_protection scripts.test_agent_pipe scripts.test_agent_process scripts.test_agent_runtime -v
          python3 -m unittest scripts.test_installer_pkg scripts.test_installer_package -v
          python3 -m unittest scripts/test_github_release.py -v
          python3 -m unittest scripts/test_release_vendor.py -v
          python3 -m unittest scripts/test_phishlang_policy.py scripts/test_phishing_package.py -v
          swift test --package-path native/updater
          KUMO_PHISHING_REFERENCE_DIRECTORY="$PWD/build/phishlang-model" swift test --package-path native/phishing
          xcrun swift test --package-path native/installer --scratch-path build/installer-native-ci-tests --jobs 1

      - name: Build the pinned Chromium source and package Kumo
        run: |
          scripts/build-source.sh build --work-dir "$KUMO_RELEASE_SOURCE_DIR"
          KUMO_NATIVE_SOURCE="$KUMO_RELEASE_SOURCE_DIR/recipe/build/src"
          PATH="$KUMO_NATIVE_SOURCE/third_party/llvm-build/Release+Asserts/bin:$PATH" \
            ninja -C "$KUMO_NATIVE_SOURCE/out/Default" -j4 kumo_native_tests
          "$KUMO_NATIVE_SOURCE/out/Default/kumo_native_tests" \
            --test-launcher-jobs=1 --test-launcher-retry-limit=0
          python3 scripts/package.py \
            --engine-app "$KUMO_RELEASE_SOURCE_DIR/recipe/build/src/out/Default/Chromium.app"

      - name: Qualify the freshly packaged native browser before notarization
        # Mandatory headed hidden-document completion gate. This dedicated
        # self-hosted Mac must have an unlocked GUI desktop; a locked runner
        # fails with bounded status diagnostics instead of skipping the gate.
        timeout-minutes: 15
        run: |
          npm install --prefix .cache/qa --no-save --package-lock=false --ignore-scripts playwright-core@1.64.1
          KUMO_QA_APP="$PWD/dist/Kumo.app" \
          KUMO_QA_OUTPUT="$PWD/build/native-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          KUMO_QA_HEADFUL=1 \
          node scripts/smoke-native-browser.mjs --run

      - name: Qualify native PhishLang warning and native Settings controls
        timeout-minutes: 10
        run: |
          KUMO_QA_APP="$PWD/dist/Kumo.app" \
          KUMO_QA_OUTPUT="$PWD/build/native-phishing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          KUMO_QA_HEADFUL=0 \
          node scripts/smoke-native-phishing.mjs --run

      - name: Qualify final network destinations and redirects
        timeout-minutes: 15
        run: |
          KUMO_QA_APP="$PWD/dist/Kumo.app" \
          KUMO_QA_EXPECTED_SOURCE_INPUTS="$(PYTHONPATH=scripts python3 -c 'from pathlib import Path; from build_receipt import current_input_digest; print(current_input_digest(Path.cwd()))')" \
          KUMO_QA_OUTPUT="$PWD/build/native-domains-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          KUMO_QA_HEADFUL=0 \
          node scripts/smoke-native-domains.mjs --run

      - name: Sign, notarize, staple and prepare signed update assets
        run: |
          set -- python3 scripts/github-release.py prepare \
            --app dist/Kumo.app \
            --output "$KUMO_RELEASE_BASE_DIRECTORY" \
            --notes "$KUMO_RELEASE_NOTES" \
            --identity "$KUMO_DEVELOPER_ID_SHA1" \
            --notary-profile "$KUMO_NOTARY_PROFILE"
          if [[ -n "$KUMO_NOTARY_KEYCHAIN" ]]; then
            set -- "$@" --notary-keychain "$KUMO_NOTARY_KEYCHAIN"
          fi
          if [[ -n "$KUMO_PASSKEY_PROFILE" ]]; then
            set -- "$@" --profile "$KUMO_PASSKEY_PROFILE"
          fi
          "$@"

      - name: Build, sign and notarize the complete Apple installer
        run: |
          mkdir -p "$KUMO_RELEASE_INSTALLER_DIRECTORY"
          ditto -x -k "$KUMO_RELEASE_BASE_DIRECTORY/$KUMO_RELEASE_ARCHIVE" "$KUMO_RELEASE_INSTALLER_DIRECTORY/browser"
          xcrun swift build --package-path native/installer --scratch-path build/installer-native -c release --arch arm64 --jobs 1
          KUMO_SETUP_BIN=$(xcrun swift build --package-path native/installer --scratch-path build/installer-native -c release --arch arm64 --jobs 1 --show-bin-path)
          set -- python3 scripts/build-installer.py \
            --app "$KUMO_RELEASE_INSTALLER_DIRECTORY/browser/Kumo.app" \
            --definitions "$KUMO_CLAMAV_DATABASE" \
            --executable "$KUMO_SETUP_BIN/KumoSetup" \
            --output "$KUMO_RELEASE_INSTALLER_DIRECTORY/Kumo Setup.app" \
            --sign --identity "$KUMO_DEVELOPER_ID_SHA1" \
            --notary-profile "$KUMO_NOTARY_PROFILE"
          if [[ -n "$KUMO_NOTARY_KEYCHAIN" ]]; then
            set -- "$@" --notary-keychain "$KUMO_NOTARY_KEYCHAIN"
          fi
          "$@"
          KUMO_STANDARD_PACKAGE="$KUMO_RELEASE_INSTALLER_DIRECTORY/Kumo.pkg"
          set -- python3 scripts/build-installer-pkg.py \
            --setup-app "$KUMO_RELEASE_INSTALLER_DIRECTORY/Kumo Setup.app" \
            --output "$KUMO_STANDARD_PACKAGE" \
            --identity "$KUMO_INSTALLER_IDENTITY" \
            --notary-profile "$KUMO_NOTARY_PROFILE"
          if [[ -n "$KUMO_NOTARY_KEYCHAIN" ]]; then
            set -- "$@" --notary-keychain "$KUMO_NOTARY_KEYCHAIN"
          fi
          "$@"
          python3 scripts/github-release.py with-installer \
            --artifacts "$KUMO_RELEASE_BASE_DIRECTORY" \
            --installer "$KUMO_STANDARD_PACKAGE" \
            --output "$KUMO_RELEASE_DIRECTORY"

      - name: Upload verified draft and optionally publish
        env:
          GH_TOKEN: ${{ github.token }}
          KUMO_PUBLISH: ${{ inputs.publish }}
        run: |
          set -- python3 scripts/github-release.py upload --artifacts "$KUMO_RELEASE_DIRECTORY"
          if [[ "$KUMO_PUBLISH" = true ]]; then
            set -- "$@" --publish
          fi
          "$@"
